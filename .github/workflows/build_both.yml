name: Build G1 + G2A plugins

on:
  workflow_dispatch:      # ручной запуск кнопкой «Run workflow»

jobs:
  build-both:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Union SDK лежит в репозитории в папке UnionSDK и копируется туда,
      # где его ожидает .vcxproj: %ALLUSERSPROFILE%\Union\SDK
      - name: Install Union SDK
        shell: pwsh
        run: |
          $dst = Join-Path $env:ALLUSERSPROFILE 'Union\SDK'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force 'UnionSDK\*' $dst

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build G1 (Win32)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Bin, PDB | Out-Null
          msbuild GothPlugin.vcxproj /m `
            "/p:Configuration=G1 MT Release" `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            "/p:TargetName=zMirrorWorldG1" `
            "/p:SolutionDir=$($PWD.Path)\"

      - name: Build G2A (Win32)
        shell: pwsh
        run: |
          msbuild GothPlugin.vcxproj /m `
            "/p:Configuration=G2A MT Release" `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            "/p:TargetName=zMirrorWorld" `
            "/p:SolutionDir=$($PWD.Path)\"

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: zMirrorWorld-G1-G2A-dlls
          path: Bin/*.dll
          if-no-files-found: error
