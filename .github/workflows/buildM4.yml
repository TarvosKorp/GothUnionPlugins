name: Build M4 plugin (all four engines in one DLL)

on:
  workflow_dispatch:      # ручной запуск кнопкой «Run workflow»

jobs:
  build-m4:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Union SDK
        shell: pwsh
        run: |
          $dst = Join-Path $env:ALLUSERSPROFILE 'Union\SDK'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force 'UnionSDK\*' $dst

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build M4 (MP x4 MT Release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Bin, PDB | Out-Null
          msbuild GothPlugin.vcxproj /m `
            "/p:Configuration=MP x4 MT Release" `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            "/p:TargetName=zSamplePlugin" `
            "/p:SolutionDir=$($PWD.Path)\\"

      - name: Include zSamplePlugin Union menu configuration
        shell: pwsh
        run: |
          Copy-Item -Force 'Plugin.d' 'Bin/zSamplePlagin.d'

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: zSamplePlugin-M4-dll
          path: |
            Bin/*.dll
            Bin/zSamplePlagin.d
          if-no-files-found: error
