name: Build G1A plugin

on:
  workflow_dispatch:      # ручной запуск кнопкой «Run workflow»

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Union SDK
        shell: pwsh
        run: |
          $dst = Join-Path $env:ALLUSERSPROFILE 'Union\SDK'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force 'UnionSDK\*' $dst

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build G1A (Win32)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Bin, PDB | Out-Null
          msbuild GothPlugin.vcxproj /m `
            "/p:Configuration=G1A MT Release" `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            "/p:TargetName=zSamplePluginG1A" `
            "/p:SolutionDir=$($PWD.Path)\"

      - name: Include zDynaMap Union menu configuration
        shell: pwsh
        run: |
          Copy-Item -Force 'Plugin.d' 'Bin/zDynaMap.d'

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: zSamplePlugin-G1A-dll
          path: |
            Bin/*.dll
            Bin/zDynaMap.d
          if-no-files-found: error
